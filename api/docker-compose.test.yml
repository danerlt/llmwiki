# 测试专用：真实 PostgreSQL + Redis，端口与主栈(5432/6379, 本地 15432)错开，
# 数据走 tmpfs 不持久化、跑完即弃。用法：
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://llmwiki:llmwiki@localhost:15433/llmwiki_test \
#     .venv/Scripts/python.exe -m pytest -q
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: llmwiki
      POSTGRES_PASSWORD: llmwiki
      POSTGRES_DB: llmwiki_test
    ports: ["15433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmwiki -d llmwiki_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7
    ports: ["16380:6379"]
    tmpfs: ["/data"]
