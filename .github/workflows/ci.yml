name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llmwiki
          POSTGRES_PASSWORD: llmwiki
          POSTGRES_DB: llmwiki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmwiki -d llmwiki_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync deps
        working-directory: api
        run: uv sync --frozen
      - name: Lint (ruff)
        working-directory: api
        run: uv run ruff check .
      - name: Run tests
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://llmwiki:llmwiki@localhost:5432/llmwiki_test
          REDIS_URL: redis://localhost:6379/0
        run: uv run python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
      - name: Install deps
        working-directory: web
        run: pnpm install --no-frozen-lockfile
      - name: Type-check & build
        working-directory: web
        run: pnpm build
      - name: Unit tests
        working-directory: web
        run: pnpm test
